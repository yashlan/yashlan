name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 12:00 WIB (05:00 UTC)
    - cron: "0 5 * * *"

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: last_7_days
          SHOW_TIME: true
